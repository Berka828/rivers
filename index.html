<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gentle Playroom - Sensory Magic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { transform: scaleX(-1); display: none; }
        
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #ffffff; z-index: 100; color: #333; text-align: center;
        }
        button {
            padding: 20px 50px; font-size: 20px; cursor: pointer; letter-spacing: 1px;
            background-color: #3498db; color: white; border: none; border-radius: 50px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); transition: 0.3s;
        }
        button:hover { background-color: #2980b9; transform: scale(1.05); }
        #log { margin-top: 20px; font-family: monospace; color: #888; }
        
        .dg.ac { z-index: 50 !important; transition: opacity 0.3s; }
        body.fullscreen .dg.ac { opacity: 0; pointer-events: none; }
        body.fullscreen #ui { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1 style="letter-spacing: 2px; font-weight: 300;">GENTLE PLAYROOM</h1>
        <p style="color: #666; margin-bottom: 30px;">Interact with a world of gentle magic.</p>
        <button onclick="startApp()">START EXPERIENCE</button>
        <div id="log">Sensors Calibrated</div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        var log = document.getElementById('log');
        var video = document.getElementById('webcam');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        var backgroundImg = new Image();
        var backgroundReady = false, imageLoadError = false;
        backgroundImg.onload = () => { backgroundReady = true; };
        backgroundImg.onerror = () => { imageLoadError = true; };
        backgroundImg.src = 'image_1779772276920845.png';

        var objects = [], motionPoints = [], popExplosions = [], ripples = [], splashes = [];
        var animals = [];
        // --- NEW: Arrays for trash and vacuum effects ---
        var trashItems = [];
        var vacuumParticles = [];
        
        var lastFrame = null, engineBooted = false;
        var activeInteractionMode = 'Launch'; 
        var modeNotification = { text: '', life: 0 }; 

        var audioCtx;
        var pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33]; 

        var magicMeter = 0, displayMagicMeter = 0;
        var magicEventActive = false, magicEventTimer = 0;
        var confetti = [], sonicRings = []; 
        var bxcmHues = [280, 30, 190, 90, 330];

        var settings = {
            interactionMode: 'Random', 
            objectCount: 15,
            animalCount: 20, 
            // --- NEW: Trash count setting ---
            trashCount: 10,
            floorLevel: 0.6,
            magicFillSpeed: 1.0,    
            soundEnabled: true,     
            gravity: 0.2, 
            kickPower: 8,
            cameraAlpha: 0.2, 
            cameraBlur: 4,
            indicatorColor: '#ffffff', 
            indicatorSize: 30,
            puddleSize: 120,
            showMagicMeter: true
        };

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playChime() {
            if (!settings.soundEnabled || !audioCtx) return; 
            var freq = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
            var osc = audioCtx.createOscillator();
            var gainNode = audioCtx.createGain();
            osc.type = 'sine'; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5); 
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }
        
        // --- NEW: Sound for vacuum ---
        function playVacuumSound() {
            if (!settings.soundEnabled || !audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function addMagic(amount) {
            if (magicEventActive) return; 
            magicMeter += amount * settings.magicFillSpeed; 
            if (magicMeter >= 100) triggerMagicEvent();
        }

        function triggerMagicEvent() {
            magicMeter = 100; magicEventActive = true; magicEventTimer = 400; 
            sonicRings = []; confetti = [];
            createSonicRing(10);
        }

        function createSonicRing(startRadius = 10) {
            sonicRings.push({
                x: canvas.width / 2, y: canvas.height * (settings.floorLevel + 0.2),
                radius: startRadius, color: `hsl(${Math.random() * 360}, 60%, 75%)`,
                thickness: Math.random() * 15 + 10, life: 1.0
            });
        }
        
        // --- NEW: Function to create a ripple anywhere on the water ---
        function createWaterRipple(x, y) {
            ripples.push({x: x, y: y, radius: 10, life: 1.0, hue: 200});
            playChime();
        }

        function startApp() {
            log.innerText = "Initializing sensory sensors...";
            initAudio(); 
            navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                video.srcObject = stream;
                video.play().catch(()=>{});
                var checkInterval = setInterval(() => {
                    if (video.videoWidth > 0 && !engineBooted) {
                        clearInterval(checkInterval);
                        engineBooted = true;
                        document.getElementById('ui').style.display = 'none';
                        initGame();
                    }
                }, 100);
            }).catch(err => { log.innerText = "Error: " + err.name; });
        }

        function initGame() {
            try {
                var gui = new dat.GUI();
                var mainFolder = gui.addFolder('Main Gameplay');
                mainFolder.add(settings, 'interactionMode', ['Launch', 'Pop', 'Random']).name('Ball Mode');
                mainFolder.add(settings, 'objectCount', 5, 40).name('Total Objects').onFinishChange(resetObjects);
                mainFolder.add(settings, 'animalCount', 0, 50).name('Water Animals').onFinishChange(resetAnimals);
                // --- NEW: Trash GUI ---
                mainFolder.add(settings, 'trashCount', 0, 30).name('Trash Items').onFinishChange(resetTrash);
                mainFolder.add(settings, 'floorLevel', 0.5, 1.0).name('Water Level');
                mainFolder.add(settings, 'soundEnabled').name('Sound ON/OFF');
                mainFolder.open();
                var magicFolder = gui.addFolder('Magic & Physics');
                magicFolder.add(settings, 'magicFillSpeed', 0.1, 5.0).name('Fill Speed');
                magicFolder.add(settings, 'gravity', 0.05, 0.5).name('Gravity');
                magicFolder.add(settings, 'kickPower', 2, 20).name('Impact Force');
                magicFolder.add(settings, 'showMagicMeter').name('Show Meter');
                var envFolder = gui.addFolder('Environment');
                envFolder.add(settings, 'puddleSize', 50, 300).name('Ripple Base Size');
                var mirrorFolder = gui.addFolder('Camera Mirror');
                mirrorFolder.add(settings, 'cameraAlpha', 0, 1).name('Visibility');
                mirrorFolder.add(settings, 'cameraBlur', 0, 20).name('Softness');
                var touchFolder = gui.addFolder('Touch Points');
                touchFolder.addColor(settings, 'indicatorColor').name('Color');
                touchFolder.add(settings, 'indicatorSize', 5, 60).name('Size');
            } catch(e) {}

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) document.body.classList.add('fullscreen');
                else document.body.classList.remove('fullscreen');
            });
            
            setInterval(cycleInteractionMode, 20000); 
            showModeChangeNotification(settings.interactionMode === 'Random' ? 'Launch' : settings.interactionMode); 

            resetObjects();
            resetAnimals();
            resetTrash(); // --- NEW ---
            trackMotion();
            gameLoop();
        }

        function cycleInteractionMode() { 
            if (settings.interactionMode === 'Random') {
                activeInteractionMode = (activeInteractionMode === 'Launch') ? 'Pop' : 'Launch';
                showModeChangeNotification(activeInteractionMode);
            }
        }
        
        function showModeChangeNotification(mode) { 
            modeNotification.text = `Ball Mode: ${mode}`;
            modeNotification.life = 1.0;
        }

        function trackMotion() {
            var mCanvas = document.createElement('canvas');
            var mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
            mCanvas.width = 64; mCanvas.height = 48;

            function scan() {
                if (video.readyState < 3) { setTimeout(scan, 100); return; }
                mCtx.drawImage(video, 0, 0, 64, 48);
                var current = mCtx.getImageData(0, 0, 64, 48).data;
                motionPoints = []; 
                if (lastFrame) {
                    let rawMotion = [];
                    for (var i = 0; i < current.length; i += 4) {
                        if (Math.abs(current[i] - lastFrame[i]) > 45) {
                            var x = (1.0 - (((i/4) % 64) / 64)) * canvas.width;
                            var y = (Math.floor(i/4/64))/48 * canvas.height;
                            rawMotion.push({ x: x, y: y });
                        }
                    }
                    if (rawMotion.length > 0) {
                        let topPt = rawMotion[0], bottomPt = rawMotion[0], leftPt = rawMotion[0], rightPt = rawMotion[0];
                        rawMotion.forEach(p => {
                            if (p.y < topPt.y) topPt = p; if (p.y > bottomPt.y) bottomPt = p; 
                            if (p.x < leftPt.x) leftPt = p; if (p.x > rightPt.x) rightPt = p;   
                        });
                        motionPoints.push(topPt, bottomPt, leftPt, rightPt);

                        motionPoints.forEach(pt => {
                            // --- NEW: Water Ripple Interaction & Trash Cleanup ---
                            const waterY = canvas.height * settings.floorLevel;
                            if (pt.y > waterY - 30 && pt.y < waterY + 30) {
                                if(Math.random() > 0.9) createWaterRipple(pt.x, waterY);
                            }

                            trashItems.forEach((trash, index) => {
                                if (!trash.active) return;
                                var dx = trash.x - pt.x;
                                var dy = trash.y - pt.y;
                                if (Math.sqrt(dx*dx + dy*dy) < 40) {
                                    trash.active = false; // Mark for removal
                                    createVacuumEffect(trash.x, trash.y, pt);
                                    playVacuumSound();
                                    addMagic(10); // Reward for cleaning
                                }
                            });


                            objects.forEach((obj, index) => {
                                if (!obj) return;
                                var dx = obj.x - pt.x, dy = obj.y - pt.y;
                                if (Math.sqrt(dx*dx + dy*dy) < (obj.radius || settings.indicatorSize) + 30) {
                                    switch(obj.type) {
                                        case 'ball':
                                            if (activeInteractionMode === 'Launch') { obj.vy = -settings.kickPower; obj.vx = (obj.x - pt.x) * 0.15; addMagic(2); } 
                                            else { createPopExplosion(obj.x, obj.y, obj.colorHue); objects[index] = createObject(); addMagic(5); }
                                            break;
                                        case 'leaf': obj.vy = -settings.kickPower * 0.5; obj.vx += (obj.x - pt.x) * 0.1; addMagic(1); break;
                                        case 'puddle':
                                            if (obj.cooldown <= 0) {
                                                obj.colorHue = Math.floor(Math.random() * 360); obj.isColorful = true;
                                                ripples.push({x: obj.x, y: obj.y, radius: 20, life: 1.0, hue: obj.colorHue});
                                                createSplash(obj.x, obj.y, obj.colorHue); playChime(); addMagic(4); obj.cooldown = 30; 
                                            }
                                            break;
                                    }
                                }
                            });
                        });
                    }
                }
                objects.forEach(obj => { if (obj && obj.type === 'puddle' && obj.cooldown > 0) obj.cooldown--; });
                lastFrame = new Uint8ClampedArray(current);
                setTimeout(scan, 60);
            }
            scan();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);
            
            if (settings.interactionMode !== 'Random' && activeInteractionMode !== settings.interactionMode) {
                 activeInteractionMode = settings.interactionMode;
                 showModeChangeNotification(activeInteractionMode);
            }

            if (backgroundReady) { ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height); } 
            else {
                ctx.fillStyle = '#1c274c'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (imageLoadError) {
                    ctx.fillStyle = 'red'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
                    ctx.fillText("Error: Background image 'image_1779772276920845.png' not found.", canvas.width / 2, canvas.height / 2);
                    ctx.fillText("Please make sure it is in the same folder as the HTML file.", canvas.width / 2, canvas.height / 2 + 30);
                }
            }

            drawMirroredCamera();

            if (magicEventActive) {
                ctx.save(); ctx.globalAlpha = Math.min((magicEventTimer / 400) * 0.15, 0.15);
                ctx.fillStyle = '#FFFAF0'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
            }

            drawTouchIndicators();
            if (settings.showMagicMeter) drawMagicMeter();
            drawAndUpdateAnimals();
            drawAndUpdateTrash(); // --- NEW ---
            drawAndUpdateVacuum(); // --- NEW ---
            drawAndUpdateObjects(); 
            drawAndUpdatePops();
            drawAndUpdateSplashes(); 
            drawAndUpdateRipples(); 

            if (magicEventActive) {
                if (magicEventTimer % 80 === 0 && magicEventTimer > 100) createSonicRing();
                if (magicEventTimer > 100 && confetti.length < 80 && Math.random() > 0.5) {
                    confetti.push({
                        x: Math.random() * canvas.width, y: -20, vx: Math.sin(magicEventTimer * 0.05) * 2,
                        vy: Math.random() * 1.5 + 1.0, color: Math.random() > 0.5 ? '#FFFACD' : '#FFE4B5',
                        size: Math.random() * 6 + 4, rotation: Math.random() * Math.PI * 2, rs: (Math.random() - 0.5) * 0.05, opacity: 0
                    });
                }
                drawAndUpdateSonicRings();
                drawAndUpdateConfetti();
                magicEventTimer--;
                if (magicEventTimer <= 0) { magicEventActive = false; magicMeter = 0; }
            }
            drawNotifications();
        }

        function drawMagicMeter() {
            var barWidth = 30; var barHeight = canvas.height * 0.5;
            var x = 40; var y = (canvas.height / 2) - (barHeight / 2);
            displayMagicMeter += (magicMeter - displayMagicMeter) * 0.05;
            ctx.fillStyle = 'rgba(40, 40, 40, 0.4)'; ctx.fillRect(x, y, barWidth, barHeight);
            var fillHeight = (displayMagicMeter / 100) * barHeight;
            var fillY = y + barHeight - fillHeight;
            var grad = ctx.createLinearGradient(x, y + barHeight, x, y);
            grad.addColorStop(0, '#ff4444'); grad.addColorStop(0.5, '#ffeb3b'); grad.addColorStop(1, '#00C851');
            ctx.save(); ctx.fillStyle = grad; ctx.fillRect(x, fillY, barWidth, fillHeight); ctx.restore();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)'; ctx.lineWidth = 4; ctx.strokeRect(x, y, barWidth, barHeight);
        }

        function drawAndUpdateSonicRings() {
            for (let i = sonicRings.length - 1; i >= 0; i--) {
                let r = sonicRings[i]; r.radius += 3; r.life -= 0.005;
                if (r.life <= 0) sonicRings.splice(i, 1);
                else {
                    ctx.save(); ctx.globalAlpha = r.life * 0.5; ctx.strokeStyle = r.color; ctx.lineWidth = r.thickness;
                    ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
                }
            }
        }

        function drawAndUpdateConfetti() {
             for (let c of confetti) {
                c.x += c.vx; c.y += c.vy; c.rotation += c.rs;
                if (c.opacity < 1.0 && magicEventTimer > 60) c.opacity += 0.05;
                if (magicEventTimer <= 60) c.opacity = Math.max(0, magicEventTimer / 60);
                ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rotation);
                ctx.globalAlpha = c.opacity; ctx.fillStyle = c.color; 
                ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size * 0.6); ctx.restore();
                if (c.x < 0) c.x = canvas.width; if (c.x > canvas.width) c.x = 0;
            }
        }

        function drawAndUpdateObjects() {
             var floorY = canvas.height * settings.floorLevel; 
             objects.forEach((obj, i) => {
                if (!obj) return;
                switch(obj.type) {
                    case 'ball': updateBall(obj, floorY); break;
                    case 'leaf': updateLeaf(obj, floorY); break;
                    case 'puddle': updatePuddle(obj, floorY); break;
                }
                ctx.save();
                switch(obj.type) {
                    case 'ball': drawBall(obj, floorY); break;
                    case 'leaf': drawLeaf(obj, floorY); break;
                    case 'puddle': drawPuddle(obj, floorY); break;
                }
                ctx.restore();
                if (obj.y > canvas.height + 50) objects[i] = createObject();
            });
        }
        
        function updateBall(o, floorY) {
            o.vy += settings.gravity; o.x += o.vx; o.y += o.vy; o.vx *= 0.94; o.vy *= 0.94;
            if (o.y + o.radius > floorY) { o.y = floorY - o.radius; o.vy *= -0.4; }
        }
        function drawBall(o, floorY) {
            ctx.fillStyle = 'rgba(0,0,0,0.06)'; ctx.beginPath(); ctx.ellipse(o.x, floorY, o.radius, o.radius * 0.2, 0, 0, 2*Math.PI); ctx.fill();
            var grd = ctx.createRadialGradient(o.x-o.radius*0.3, o.y-o.radius*0.3, o.radius*0.1, o.x, o.y, o.radius);
            grd.addColorStop(0, `hsl(${o.colorHue}, 80%, 85%)`); grd.addColorStop(1, `hsl(${o.colorHue}, 70%, 40%)`);
            ctx.beginPath(); ctx.arc(o.x, o.y, o.radius, 0, 2*Math.PI); ctx.fillStyle = grd; ctx.fill();
        }

        function updateLeaf(o, floorY) {
            o.vy += settings.gravity * 0.2; o.vx += (Math.random() - 0.5) * 0.2; o.x += o.vx; o.y += o.vy;
            o.vx *= 0.96; o.vy *= 0.98; o.rotation += o.rotationSpeed;
            if (o.y + o.radius > floorY) { o.y = floorY - o.radius; o.vy = 0; o.vx *= 0.8; }
        }
        function drawLeaf(o, floorY) {
            ctx.translate(o.x, o.y); ctx.rotate(o.rotation); ctx.fillStyle = `hsl(${o.colorHue}, 70%, 55%)`; 
            ctx.beginPath(); ctx.moveTo(0, -o.radius); ctx.quadraticCurveTo(o.radius, 0, 0, o.radius);
            ctx.quadraticCurveTo(-o.radius, 0, 0, -o.radius); ctx.fill();
        }

        function updatePuddle(o, floorY) { o.y = floorY; }
        function drawPuddle(o, floorY) {
            let fillStyle = o.isColorful ? `hsla(${o.colorHue}, 80%, 60%, 0.4)` : 'rgba(100, 180, 255, 0.3)';
            ctx.fillStyle = fillStyle; ctx.beginPath(); ctx.ellipse(o.x, o.y, o.radius, o.radius * 0.3, 0, 0, 2 * Math.PI); ctx.fill();
        }
        
        function drawAndUpdateRipples() {
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i]; r.radius += 1.5; r.life -= 0.02;
                if (r.life <= 0) ripples.splice(i, 1);
                else { ctx.strokeStyle = `hsla(${r.hue}, 80%, 70%, ${r.life * 0.5})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.3, 0, 0, 2 * Math.PI); ctx.stroke(); }
            }
        }
        
        function createSplash(x, y, hue) {
            for (let i = 0; i < Math.floor(Math.random() * 15) + 5; i++) {
                var angle = -Math.PI/2+(Math.random()-0.5)*1.5, speed = Math.random()*8+3; 
                splashes.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1.0, hue, size: Math.random()*4+2 });
            }
        }
        
        function drawAndUpdateSplashes() {
            for (let i = splashes.length - 1; i >= 0; i--) {
                let s = splashes[i]; s.x += s.vx; s.y += s.vy; s.vy += settings.gravity * 0.8; s.life -= 0.03;
                if (s.life <= 0) splashes.splice(i, 1);
                else { ctx.fillStyle = `hsla(${s.hue}, 80%, 60%, ${s.life})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); }
            }
        }
        
        // --- NEW: TRASH & VACUUM FUNCTIONS ---
        function resetTrash() {
            trashItems = [];
            for(let i=0; i<settings.trashCount; i++) trashItems.push(createTrash());
        }

        function createTrash(x, y) {
            const waterYStart = canvas.height * settings.floorLevel;
            const waterHeight = canvas.height - waterYStart;
            const types = ['bottle', 'can', 'bag'];

            return {
                type: types[Math.floor(Math.random() * types.length)],
                x: x || Math.random() * canvas.width,
                y: y || waterYStart + Math.random() * waterHeight * 0.8,
                vx: (Math.random() - 0.5) * 0.3,
                size: Math.random() * 10 + 15,
                phase: Math.random() * Math.PI * 2,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 0.01,
                active: true,
                scale: 1.0
            };
        }

        function drawAndUpdateTrash() {
            const waterYStart = canvas.height * settings.floorLevel;
            // Remove inactive trash and add new ones to keep the count
            for (let i = trashItems.length - 1; i >= 0; i--) {
                if (!trashItems[i].active && trashItems[i].scale <= 0) {
                    trashItems.splice(i, 1);
                    trashItems.push(createTrash(Math.random() > 0.5 ? -50 : canvas.width + 50));
                }
            }

            trashItems.forEach(t => {
                if(t.active) {
                    t.x += t.vx;
                    t.y += Math.sin(t.phase) * 0.1;
                    t.phase += 0.02;
                    t.rotation += t.rotationSpeed;

                    if (t.x > canvas.width + 50) t.x = -40;
                    if (t.x < -50) t.x = canvas.width + 40;
                    if (t.y < waterYStart) t.y = waterYStart;
                } else {
                    // Shrink when vacuumed
                    t.scale = Math.max(0, t.scale - 0.05);
                }

                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.rotation);
                ctx.scale(t.scale, t.scale);
                ctx.fillStyle = 'rgba(150, 160, 170, 0.8)';
                ctx.strokeStyle = 'rgba(50, 60, 70, 0.9)';
                ctx.lineWidth = 2;

                switch (t.type) {
                    case 'bottle': ctx.fillRect(-t.size * 0.5, -t.size * 1.5, t.size, t.size * 3); ctx.strokeRect(-t.size * 0.5, -t.size * 1.5, t.size, t.size * 3); break;
                    case 'can': ctx.beginPath(); ctx.arc(0, 0, t.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); break;
                    case 'bag': ctx.beginPath(); ctx.moveTo(-t.size, -t.size); ctx.quadraticCurveTo(0, 0, t.size, -t.size); ctx.quadraticCurveTo(0, t.size, -t.size, -t.size); ctx.fill(); break;
                }
                ctx.restore();
            });
        }
        
        function createVacuumEffect(x, y, target) {
            for (let i = 0; i < 40; i++) {
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 30 + 10;
                vacuumParticles.push({
                    x: x + Math.cos(angle) * dist,
                    y: y + Math.sin(angle) * dist,
                    life: 1.0,
                    target: target
                });
            }
        }
        
        function drawAndUpdateVacuum() {
            for (let i = vacuumParticles.length - 1; i >= 0; i--) {
                let p = vacuumParticles[i];
                let dx = p.target.x - p.x;
                let dy = p.target.y - p.y;
                p.x += dx * 0.15;
                p.y += dy * 0.15;
                p.life -= 0.04;
                if (p.life <= 0) {
                    vacuumParticles.splice(i, 1);
                } else {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.life * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // --- ANIMAL FUNCTIONS (UNCHANGED) ---
        function resetAnimals() { animals = []; for (let i = 0; i < settings.animalCount; i++) animals.push(createAnimal()); }
        function createAnimal() {
            const waterYStart = canvas.height * settings.floorLevel; const waterHeight = canvas.height - waterYStart;
            const type = ['fish', 'crab', 'turtle', 'school'][Math.floor(Math.random() * 4)];
            let animal = { type, x: Math.random()*canvas.width, y: waterYStart + (Math.random()*waterHeight*0.9), vx: (Math.random()-0.5)*2+0.5, size: Math.random()*15+10, color: `hsl(${Math.random()*360}, 50%, 60%)`, phase: Math.random()*Math.PI*2 };
            if (type === 'crab') { animal.y = canvas.height-20; animal.vx = (Math.random()-0.5)*1.0; }
            if (type === 'turtle') { animal.vx = (Math.random()-0.5)*0.5+0.2; animal.size = Math.random()*20+20; }
            if (type === 'school') { animal.count = Math.floor(Math.random()*5)+4; animal.fishes = []; for(let i=0; i<animal.count; i++) animal.fishes.push({ ox: (Math.random()-0.5)*50, oy: (Math.random()-0.5)*50, phase: Math.random()*Math.PI*2 }); }
            return animal;
        }
        function drawAndUpdateAnimals() {
            const waterYStart = canvas.height * settings.floorLevel;
            animals.forEach(a => {
                a.x += a.vx; a.phase += 0.05;
                if (a.x > canvas.width+a.size*5) a.x = -a.size*4; if (a.x < -a.size*5) a.x = canvas.width+a.size*4;
                if (a.type !== 'crab') { a.y += Math.sin(a.phase)*0.3; if(a.y < waterYStart) a.y = waterYStart; if(a.y > canvas.height) a.y = canvas.height; }
                ctx.save(); ctx.translate(a.x, a.y); if(a.vx < 0) ctx.scale(-1, 1);
                switch(a.type) {
                    case 'fish': drawFish(a); break; case 'crab': drawCrab(a); break; case 'turtle': drawTurtle(a); break;
                    case 'school': a.fishes.forEach(f => { ctx.save(); ctx.translate(f.ox, f.oy+Math.sin(a.phase+f.phase)*5); drawFish({ ...a, size: a.size*0.5}); ctx.restore(); }); break;
                }
                ctx.restore();
            });
        }
        function drawFish(a) { ctx.fillStyle = a.color; ctx.beginPath(); ctx.ellipse(0, 0, a.size, a.size * 0.5, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-a.size, 0); ctx.lineTo(-a.size*1.5, -a.size*0.4); ctx.lineTo(-a.size*1.5, a.size*0.4); ctx.closePath(); ctx.fill(); }
        function drawCrab(a) { ctx.fillStyle = 'rgba(210, 80, 50, 0.8)'; ctx.beginPath(); ctx.arc(0, 0, a.size, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = 'rgba(210, 80, 50, 0.8)'; ctx.lineWidth = 4; for(let i=-2; i<=2; i++) { if (i===0) continue; let angle = i*0.6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(angle)*a.size*1.5, Math.sin(angle)*a.size*1.5); ctx.stroke(); } }
        function drawTurtle(a) { ctx.fillStyle = 'rgba(80, 150, 30, 0.7)'; ctx.beginPath(); ctx.arc(0, 0, a.size, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(100, 180, 50, 0.8)'; ctx.beginPath(); ctx.arc(a.size*0.8, 0, a.size*0.4, 0, Math.PI*2); ctx.fill(); }

        // --- CORE OBJECT/UTILITY FUNCTIONS (UNCHANGED) ---
        function resetObjects() { objects = []; for (var i=0; i<settings.objectCount; i++) objects.push(createObject()); }
        function createObject() {
            var floorY = canvas.height*settings.floorLevel, objectType = ['ball', 'leaf', 'puddle'][Math.floor(Math.random()*3)];
            let newObj = { type: objectType, x: Math.random()*canvas.width, y: Math.random()*floorY*0.8, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, radius: Math.random()*20+30, cooldown: 0 };
            switch(objectType) {
                case 'ball': newObj.colorHue = Math.floor(Math.random()*360); break;
                case 'leaf': newObj.colorHue = bxcmHues[Math.floor(Math.random()*bxcmHues.length)]; newObj.rotation = Math.random()*Math.PI*2; newObj.rotationSpeed = (Math.random()-0.5)*0.04; break;
                case 'puddle': newObj.y = floorY; newObj.radius = Math.random()*40+settings.puddleSize; newObj.isColorful = false; newObj.colorHue = 210; break;
            }
            return newObj;
        }
        function drawMirroredCamera() { 
            ctx.save(); ctx.globalAlpha = settings.cameraAlpha; ctx.filter = `blur(${settings.cameraBlur}px)`;
            ctx.scale(-1, 1); ctx.translate(-canvas.width, 0);
            if (video.readyState >= 3) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }
        function drawTouchIndicators() { 
            motionPoints.forEach(p => {
                var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, settings.indicatorSize * 1.5);
                grad.addColorStop(0, settings.indicatorColor + '66'); grad.addColorStop(1, settings.indicatorColor + '00');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, settings.indicatorSize * 1.5, 0, 2*Math.PI); ctx.fill();
            });
        }
        function createPopExplosion(x, y, hue) { 
            for (let i = 0; i < 30; i++) {
                var angle = (i/30)*2*Math.PI, speed = Math.random()*settings.kickPower*0.5+1;
                popExplosions.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1.0, hue, lightness: 70+Math.random()*20 });
            }
        }
        function drawAndUpdatePops() { 
            for (let i = popExplosions.length-1; i >= 0; i--) {
                let p = popExplosions[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=settings.gravity*0.5; p.life-=0.03;
                if (p.life<=0) popExplosions.splice(i, 1);
                else { ctx.fillStyle = `hsla(${p.hue}, 80%, ${p.lightness}%, ${p.life})`; ctx.fillRect(p.x, p.y, 4, 4); }
            }
        }
        function drawNotifications() { 
             if (document.fullscreenElement) return; 
             if (modeNotification.life > 0) {
                modeNotification.life-=0.01; ctx.save(); ctx.globalAlpha = Math.min(1, modeNotification.life*3); 
                ctx.fillStyle = '#333333'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(modeNotification.text, canvas.width/2, 50); ctx.restore();
            }
        }
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        document.addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } });
    </script>
</body>
