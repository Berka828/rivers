<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gentle Playroom - Core Interaction</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #webcam { transform: scaleX(-1); display: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; z-index: 100; color: #333; text-align: center; }
        button { padding: 20px 50px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Core Interaction Test</h1>
        <p>This version focuses on providing a stable, mirrored view with accurate touchpoints on your hands and feet.</p>
        <button onclick="startApp()">START EXPERIENCE</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <video id="webcam" playsinline autoplay muted></video>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');

        let lastFrame;
        let motionPoints = []; // The 4-5 key points (hands, feet, etc.)

        const settings = {
            motionSensitivity: 45, // How much a pixel must change to be considered "motion"
            cameraAlpha: 0.2,      // How visible you are
            indicatorSize: 20,     // Size of the circles on your hands/feet
            waterLevel: 0.8        // Where the "water" surface is
        };

        function startApp() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    const checkInterval = setInterval(() => {
                        if (video.videoWidth > 0) {
                            clearInterval(checkInterval);
                            document.getElementById('ui').style.display = 'none';
                            resizeCanvas();
                            window.addEventListener('resize', resizeCanvas);
                            trackMotion();
                            gameLoop();
                        }
                    }, 100);
                })
                .catch(err => {
                    document.getElementById('ui').innerHTML = `<h1>Error</h1><p>Could not access webcam. Please grant permission and refresh.</p><p><i>${err.name}</i></p>`;
                });
        }
        
        function trackMotion() {
            const mCanvas = document.createElement('canvas');
            const mCtx = mCanvas.getContext('2d', { willReadFrequently: true });
            const W = 128, H = 96; // Use a small canvas for faster processing
            mCanvas.width = W;
            mCanvas.height = H;

            function scan() {
                try {
                    if (video.readyState < 3) return; // Make sure video is ready
                    mCtx.drawImage(video, 0, 0, W, H);
                    const currentFrameData = mCtx.getImageData(0, 0, W, H).data;

                    if (lastFrame) {
                        const rawMotion = [];
                        for (let i = 0; i < currentFrameData.length; i += 4) {
                            // Compare the red channel of the current frame to the last frame
                            if (Math.abs(currentFrameData[i] - lastFrame[i]) > settings.motionSensitivity) {
                                rawMotion.push({
                                    x: (1 - ((i / 4) % W) / W) * canvas.width,
                                    y: (Math.floor((i / 4) / W) / H) * canvas.height
                                });
                            }
                        }

                        // If motion was detected, find the most extreme points
                        if (rawMotion.length > 5) {
                            let top = rawMotion[0], bottom = rawMotion[0], left = rawMotion[0], right = rawMotion[0];
                            for (const pt of rawMotion) {
                                if (pt.y < top.y) top = pt;
                                if (pt.y > bottom.y) bottom = pt;
                                if (pt.x < left.x) left = pt;
                                if (pt.x > right.x) right = pt;
                            }
                            // This gives us our specific touchpoints for hands and feet
                            motionPoints = [top, bottom, left, right];
                        } else {
                            motionPoints = [];
                        }
                    }
                    lastFrame = new Uint8ClampedArray(currentFrameData);
                } catch (e) {
                    console.error("Motion tracking failed:", e);
                } finally {
                    requestAnimationFrame(scan); // Use requestAnimationFrame for a smoother loop
                }
            }
            scan();
        }

        function gameLoop() {
            // Draw a simple background
            ctx.fillStyle = '#101020'; // Dark blue
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const waterY = canvas.height * settings.waterLevel;
            ctx.fillStyle = '#202040'; // Darker water
            ctx.fillRect(0, waterY, canvas.width, canvas.height - waterY);

            // Draw the mirrored camera feed
            ctx.save();
            ctx.globalAlpha = settings.cameraAlpha;
            ctx.scale(-1, 1);
            ctx.translate(-canvas.width, 0);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Draw the touchpoint indicators
            drawTouchIndicators();
            
            // Simple ripple interaction for feedback
            handleRipples(waterY);

            requestAnimationFrame(gameLoop);
        }

        const ripples = [];
        function handleRipples(waterY) {
            motionPoints.forEach(pt => {
                if (pt.y > waterY - 30 && Math.random() > 0.8) {
                    ripples.push({ x: pt.x, y: waterY, radius: 10, life: 1.0 });
                }
            });

            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 1.5;
                r.life -= 0.02;
                if (r.life <= 0) {
                    ripples.splice(i, 1);
                } else {
                    ctx.strokeStyle = `rgba(200, 220, 255, ${r.life * 0.5})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.4, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        function drawTouchIndicators() {
            for (const pt of motionPoints) {
                const grad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, settings.indicatorSize * 1.5);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, settings.indicatorSize * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

    </script>
</body>
</html>
