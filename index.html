<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soothing Sensory River Installation</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #05070c;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }
        #app-container {
            position: relative;
            flex-grow: 1;
            height: 100vh;
        }
        /* Full-screen embedded ambient camera tracking layer */
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.15; /* Default soft visual blend */
            pointer-events: none;
        }
        .mirror-view {
            transform: scaleX(-1);
        }
        /* Main Interactive Graphics Render View */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        /* --- 🎛️ Dashboard Control Panel Sidebar --- */
        #control-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 340px;
            height: 100%;
            background: rgba(11, 17, 32, 0.96);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255,255,255,0.08);
            padding: 25px;
            color: #f1f5f9;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            overflow-y: auto;
        }
        #control-panel.open { transform: translateX(0); }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.3);
            z-index: 60;
            transition: all 0.2s ease;
        }
        .toggle-btn:hover { background: #0ea5e9; }
        
        h3 { margin-bottom: 20px; color: #38bdf8; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .setting-group { margin-bottom: 22px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex-grow: 1; accent-color: #38bdf8; background: #1e293b; height: 6px; border-radius: 3px; appearance: none; }
        select { width: 100%; background: #1e293b; color: white; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; }
        .val-display { font-family: monospace; font-size: 13px; color: #38bdf8; width: 45px; text-align: right; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-box { position: absolute; cursor: pointer; inset: 0; background-color: #1e293b; transition: .3s; border-radius: 24px; }
        .slider-box:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-box { background-color: #0ea5e9; }
        input:checked + .slider-box:before { transform: translateX(22px); }

        #ui-score {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 30;
            pointer-events: none;
        }

        #loading {
            position: absolute;
            inset: 0;
            background: #0b1120;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            z-index: 100;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        .spinner { border: 3px solid rgba(255,255,255,0.05); width: 45px; height: 45px; border-radius: 50%; border-left-color: #0ea5e9; animation: spin 1.2s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Crafting a Calming Sensory World...</div>
    </div>

    <div id="app-container">
        <video id="webcam" autoplay playsinline class="mirror-view"></video>
        <canvas id="output_canvas"></canvas>
        
        <div id="ui-score">🗑️ River Cleaned: <span id="score-val">0</span></div>
        <button class="toggle-btn" onclick="toggleSettings()">⚙️ Adjust Setup</button>
        
        <div id="control-panel">
            <h3>Exhibit Controller</h3>
            
            <div class="setting-group">
                <label>Mirror View Movement</label>
                <label class="switch">
                    <input type="checkbox" id="param-mirror" checked onchange="updateParameters()">
                    <span class="slider-box"></span>
                </label>
            </div>

            <div class="setting-group">
                <label>Webcam Background Blend</label>
                <div class="slider-container">
                    <input type="range" id="param-cam-opac" min="0" max="0.5" step="0.01" value="0.15" oninput="updateParameters()">
                    <span class="val-display" id="val-cam-opac">15%</span>
                </div>
            </div>

            <div class="setting-group">
                <label>Tracking Overlay Style</label>
                <select id="param-style" onchange="updateParameters()">
                    <option value="dots" selected>Calming Glowing Circles</option>
                    <option value="skeleton">Skeletal Vector Lines</option>
                    <option value="none">Hidden / Invisible Tracker</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Sky Height (Top %)</label>
                <div class="slider-container">
                    <input type="range" id="param-sky" min="0.15" max="0.4" step="0.01" value="0.30" oninput="updateParameters()">
                    <span class="val-display" id="val-sky">30%</span>
                </div>
            </div>

            <div class="setting-group">
                <label>River Level (Bottom %)</label>
                <div class="slider-container">
                    <input type="range" id="param-water" min="0.55" max="0.85" step="0.01" value="0.68" oninput="updateParameters()">
                    <span class="val-display" id="val-water">68%</span>
                </div>
            </div>
            
            <div class="setting-group">
                <label>Interaction Distance</label>
                <div class="slider-container">
                    <input type="range" id="param-radius" min="60" max="250" step="10" value="130" oninput="updateParameters()">
                    <span class="val-display" id="val-radius">130px</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const loadingScreen = document.getElementById('loading');
        
        let animationTime = 0;
        let trashCleanedCount = 0;
        let activeTrackers = [];
        let rawLandmarks = null;
        
        // Entity Pools
        let fishArray = [];
        let trashArray = [];
        let padArray = [];
        let particleArray = [];

        // Smooth Sun Scaling Parameters
        let sunScale = 1.0;
        let sunRingTimer = 0;

        let CONFIG = {
            mirror: true,
            bgOpacity: 0.15,
            trackerStyle: 'dots',
            skyLineY: 0.30,
            landLineY: 0.68,
            touchRadius: 130,
            padCount: 4
        };

        function toggleSettings() {
            document.getElementById('control-panel').classList.toggle('open');
        }

        function updateParameters() {
            CONFIG.mirror = document.getElementById('param-mirror').checked;
            CONFIG.bgOpacity = parseFloat(document.getElementById('param-cam-opac').value);
            CONFIG.trackerStyle = document.getElementById('param-style').value;
            CONFIG.skyLineY = parseFloat(document.getElementById('param-sky').value);
            CONFIG.landLineY = parseFloat(document.getElementById('param-water').value);
            CONFIG.touchRadius = parseInt(document.getElementById('param-radius').value);

            document.getElementById('val-cam-opac').innerText = Math.round(CONFIG.bgOpacity * 100) + "%";
            document.getElementById('val-sky').innerText = Math.round(CONFIG.skyLineY * 100) + "%";
            document.getElementById('val-water').innerText = Math.round(CONFIG.landLineY * 100) + "%";
            document.getElementById('val-radius').innerText = CONFIG.touchRadius + "px";

            // Apply blend styling to ambient camera layer directly
            videoElement.style.opacity = CONFIG.bgOpacity;
            if(CONFIG.mirror) videoElement.classList.add('mirror-view');
            else videoElement.classList.remove('mirror-view');
            
            fishArray.forEach(f => f.resetY());
            trashArray.forEach(t => t.resetY());
            padArray.forEach(p => p.y = window.innerHeight - 35);
        }

        // =================================================================
        // 🐠 GRAPHICS ENGINE DESIGN INFUSED WITH SENSORY MODALITIES
        // =================================================================
        
        class LilyPad {
            constructor(index, total) {
                this.x = (window.innerWidth / (total + 1)) * (index + 1);
                this.y = window.innerHeight - 35; 
                this.radiusX = 75;
                this.radiusY = 24;
                // Soft, non-glaring unique sensory colors
                const colors = ['#818cf8', '#2dd4bf', '#34d399', '#fb923c'];
                this.color = colors[index % colors.length];
                this.glow = 0;
                this.squish = 1.0;
            }
            update(trackers) {
                this.glow = lerp(this.glow, 0, 0.05);
                this.squish = lerp(this.squish, 1.0, 0.08);
                
                trackers.forEach(t => {
                    if(t.y > window.innerHeight * CONFIG.landLineY) {
                        if(Math.hypot(this.x - t.x, this.y - t.y) < CONFIG.touchRadius) {
                            if(this.glow < 0.1) {
                                // Soothing slow-fading expansion rings
                                for(let r=0; r<2; r++) particleArray.push(new Particle(this.x, this.y, this.color, 'ring', 1.5));
                                this.squish = 0.65;
                            }
                            this.glow = 1.0;
                        }
                    }
                });
            }
            draw() {
                canvasCtx.save();
                canvasCtx.globalAlpha = 0.85;
                canvasCtx.shadowBlur = this.glow * 25;
                canvasCtx.shadowColor = this.color;
                canvasCtx.fillStyle = this.color;
                
                canvasCtx.beginPath();
                canvasCtx.ellipse(this.x, this.y, this.radiusX * (2.0 - this.squish), this.radiusY * this.squish, 0, 0, Math.PI * 1.8);
                canvasCtx.lineTo(this.x, this.y);
                canvasCtx.fill();
                canvasCtx.restore();
            }
        }

        class Fish {
            constructor(typeIndex) {
                this.x = Math.random() * window.innerWidth;
                this.resetY();
                this.size = 30 + Math.random() * 12;
                this.speedX = (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.8); // Lower velocities
                this.typeIndex = typeIndex % 3;
                this.wiggle = Math.random() * 10;
                
                // Diversified soothing types
                if(this.typeIndex === 0) { this.color = '#38bdf8'; this.typeStr = 'trout'; }
                else if(this.typeIndex === 1) { this.color = '#facc15'; this.typeStr = 'goldfish'; }
                else { this.color = '#e2e8f0'; this.typeStr = 'minnow'; }
            }
            resetY() {
                let waterTop = window.innerHeight * CONFIG.landLineY;
                this.y = waterTop + 40 + Math.random() * (window.innerHeight - waterTop - 90);
            }
            update(trackers) {
                this.wiggle += 0.12; // Slow organic wiggle rate
                this.x += this.speedX;
                if (this.x < -100 || this.x > window.innerWidth + 100) this.speedX *= -1;

                trackers.forEach(t => {
                    if(t.y > window.innerHeight * CONFIG.landLineY) {
                        let dist = Math.hypot(this.x - t.x, this.y - t.y);
                        if(dist < CONFIG.touchRadius) {
                            // Turn around smoothly rather than popping away abruptly
                            this.speedX = lerp(this.speedX, Math.sign(this.x - t.x) * 2.5, 0.05);
                            if(Math.random() > 0.94) particleArray.push(new Particle(this.x, this.y, 'rgba(255,255,255,0.25)', 'dot'));
                        }
                    }
                });
            }
            draw() {
                canvasCtx.save();
                canvasCtx.translate(this.x, this.y);
                if (this.speedX < 0) canvasCtx.scale(-1, 1);

                canvasCtx.fillStyle = this.color;
                canvasCtx.beginPath();
                let tail = Math.sin(this.wiggle) * 5;

                if(this.typeStr === 'goldfish') {
                    // Fan tail model anatomy
                    canvasCtx.moveTo(this.size, 0);
                    canvasCtx.quadraticCurveTo(0, -this.size * 0.7, -this.size * 0.4, tail);
                    canvasCtx.lineTo(-this.size, tail - 15);
                    canvasCtx.lineTo(-this.size * 0.6, tail);
                    canvasCtx.lineTo(-this.size, tail + 15);
                    canvasCtx.quadraticCurveTo(0, this.size * 0.7, this.size, 0);
                } else {
                    // Sleek streamlined minnow/trout profile
                    canvasCtx.moveTo(this.size, 0);
                    canvasCtx.quadraticCurveTo(0, -this.size * 0.4, -this.size, tail);
                    canvasCtx.lineTo(-this.size - 12, tail - 10);
                    canvasCtx.lineTo(-this.size - 12, tail + 10);
                    canvasCtx.quadraticCurveTo(0, this.size * 0.4, this.size, 0);
                }
                canvasCtx.fill();
                canvasCtx.restore();
            }
        }

        class Trash {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.resetY();
                this.size = 20;
                this.speedX = 0.4 + Math.random() * 0.4;
                this.rotation = Math.random() * Math.PI;
                this.isVacuumed = false;
                this.type = Math.random() > 0.5 ? 'bottle' : 'can';
            }
            resetY() {
                let waterTop = window.innerHeight * CONFIG.landLineY;
                this.y = waterTop + 30 + Math.random() * (window.innerHeight - waterTop - 90);
            }
            update(trackers) {
                if (!this.isVacuumed) {
                    this.x += this.speedX;
                    this.rotation += 0.005;
                    if (this.x > window.innerWidth + 50) this.x = -50;
                }

                trackers.forEach(t => {
                    if (t.y > window.innerHeight * CONFIG.landLineY) {
                        let dist = Math.hypot(this.x - t.x, this.y - t.y);
                        if (dist < CONFIG.touchRadius) {
                            this.isVacuumed = true;
                            // Smooth interpolation instead of snapping dramatically
                            this.x = lerp(this.x, t.x, 0.15);
                            this.y = lerp(this.y, t.y, 0.15);

                            if (dist < 25) {
                                for (let p = 0; p < 8; p++) particleArray.push(new Particle(this.x, this.y, '#34d399', 'dot', 0.8));
                                trashCleanedCount++;
                                scoreVal.innerText = trashCleanedCount;
                                let idx = trashArray.indexOf(this);
                                if(idx !== -1) trashArray[idx] = new Trash();
                            }
                        }
                    }
                });
            }
            draw() {
                canvasCtx.save();
                canvasCtx.globalAlpha = 0.5; // Soft translucent styling to reduce visual clutter
                canvasCtx.translate(this.x, this.y);
                canvasCtx.rotate(this.rotation);
                canvasCtx.strokeStyle = 'rgba(255,255,255,0.4)';
                canvasCtx.lineWidth = 2;
                if(this.type === 'bottle') {
                    canvasCtx.strokeRect(-8, -18, 16, 36);
                    canvasCtx.strokeRect(-4, -24, 8, 6);
                } else {
                    canvasCtx.strokeRect(-10, -14, 20, 28);
                }
                canvasCtx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, type = 'dot', speedScale = 1.0) {
                this.x = x; this.y = y; this.color = color; this.type = type;
                this.size = type === 'ring' ? 5 : 2 + Math.random() * 4;
                this.vx = (Math.random() - 0.5) * 3 * speedScale;
                this.vy = (Math.random() - 0.5) * 3 * speedScale;
                this.alpha = 1.0;
            }
            update() {
                if(this.type === 'ring') {
                    this.size += 2.2; // Gentle outward ripple scaling speed
                    this.alpha -= 0.015;
                } else {
                    this.x += this.vx; this.y += this.vy;
                    this.alpha -= 0.015;
                }
            }
            draw() {
                canvasCtx.save();
                canvasCtx.globalAlpha = this.alpha;
                canvasCtx.beginPath();
                if(this.type === 'ring') {
                    canvasCtx.strokeStyle = this.color;
                    canvasCtx.lineWidth = 3;
                    canvasCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    canvasCtx.stroke();
                } else {
                    canvasCtx.fillStyle = this.color;
                    canvasCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    canvasCtx.fill();
                }
                canvasCtx.restore();
            }
        }

        // =================================================================
        // 🗺️ 3-TIER ECO BACKGROUND SCENE PRODUCER
        // =================================================================
        
        function drawSceneTiers(trackers) {
            let w = canvasElement.width;
            let h = canvasElement.height;
            let skyLimit = h * CONFIG.skyLineY;
            let landLimit = h * CONFIG.landLineY;

            // 🌤️ 1. Sky Tier
            let skyGrad = canvasCtx.createLinearGradient(0, 0, 0, skyLimit);
            skyGrad.addColorStop(0, '#0f172a'); skyGrad.addColorStop(1, '#1e293b'); // Dark soothing twilight
            canvasCtx.fillStyle = skyGrad; canvasCtx.fillRect(0, 0, w, skyLimit);

            // ☀️ Soothing Radiant Sun (Golden Yellow Rings Engine)
            let sunX = w * 0.5, sunY = h * 0.12, sunBaseRad = 45;
            let isNearSun = false;
            
            trackers.forEach(t => {
                if(t.y < skyLimit) {
                    if(Math.hypot(t.x - sunX, t.y - sunY) < 140) isNearSun = true;
                }
            });

            if(isNearSun) {
                sunScale = lerp(sunScale, 1.2, 0.05);
                sunRingTimer++;
                if(sunRingTimer % 35 === 0) { // Soft cyclic intervals
                    particleArray.push(new Particle(sunX, sunY, '#facc15', 'ring', 0.5));
                }
            } else {
                sunScale = lerp(sunScale, 1.0, 0.05);
            }

            canvasCtx.save();
            canvasCtx.translate(sunX, sunY);
            canvasCtx.scale(sunScale, sunScale);
            canvasCtx.fillStyle = '#eab308';
            canvasCtx.beginPath(); canvasCtx.arc(0, 0, sunBaseRad, 0, Math.PI*2); canvasCtx.fill();
            
            // Minimal serene face
            canvasCtx.fillStyle = '#1e293b'; canvasCtx.beginPath();
            canvasCtx.arc(-12, -6, 4, 0, Math.PI*2); canvasCtx.arc(14, -6, 4, 0, Math.PI*2); canvasCtx.fill();
            canvasCtx.strokeStyle = '#1e293b'; canvasCtx.lineWidth = 3; canvasCtx.lineCap = 'round';
            canvasCtx.beginPath(); canvasCtx.arc(0, 4, 10, 0, Math.PI); canvasCtx.stroke();
            canvasCtx.restore();

            // 🪵 2. Land Tier (Middle Third)
            let landGrad = canvasCtx.createLinearGradient(0, skyLimit, 0, landLimit);
            landGrad.addColorStop(0, '#064e3b'); landGrad.addColorStop(1, '#022c22'); // Forest deep green tones
            canvasCtx.fillStyle = landGrad; canvasCtx.fillRect(0, skyLimit, w, landLimit - skyLimit);

            // 🌊 3. Water Tier (Lower Third)
            let waterGrad = canvasCtx.createLinearGradient(0, landLimit, 0, h);
            waterGrad.addColorStop(0, 'rgba(12, 74, 110, 0.85)'); waterGrad.addColorStop(1, 'rgba(3, 41, 63, 0.95)');
            canvasCtx.fillStyle = waterGrad; canvasCtx.fillRect(0, landLimit, w, h - landLimit);

            // Gentle moving wave lines
            animationTime += 0.015;
            canvasCtx.fillStyle = 'rgba(14, 165, 233, 0.15)';
            canvasCtx.beginPath(); canvasCtx.moveTo(0, landLimit);
            for(let x=0; x<=w; x+=30) canvasCtx.lineTo(x, landLimit + Math.sin(x*0.01 + animationTime * 1.5)*5);
            canvasCtx.lineTo(w, h); canvasCtx.lineTo(0, h); canvasCtx.fill();
        }

        // =================================================================
        // 🦴 SYSTEM SKELETAL INTERACTION LOGIC
        // =================================================================
        
        function onPoseEngineResults(results) {
            let w = canvasElement.width;
            let h = canvasElement.height;
            activeTrackers = [];
            rawLandmarks = results.poseLandmarks;

            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.save();
            
            // Coordinate transformation matching configuration
            if(CONFIG.mirror) {
                canvasCtx.translate(w, 0); canvasCtx.scale(-1, 1);
            }

            if (rawLandmarks) {
                loadingScreen.style.opacity = 0;
                
                // Mapped Targets: Wrists(15,16), Index Fingers(19,20), Feet/Ankles(27,28,31,32)
                const boneIndices = [15, 16, 19, 20, 27, 28, 31, 32];
                boneIndices.forEach(idx => {
                    let mark = rawLandmarks[idx];
                    if(mark && mark.visibility > 0.55) {
                        let calcX = CONFIG.mirror ? (mark.x * w) : (w - (mark.x * w));
                        activeTrackers.push({ x: calcX, y: mark.y * h, type: idx });
                    }
                });
            }

            // Render Layers
            drawSceneTiers(activeTrackers);

            // Update System Pool Loops
            padArray.forEach(p => { p.update(activeTrackers); p.draw(); });
            fishArray.forEach(f => { f.update(activeTrackers); f.draw(); });
            trashArray.forEach(t => { t.update(activeTrackers); t.draw(); });
            
            particleArray.forEach((part, index) => {
                part.update(); part.draw();
                if(part.alpha <= 0) particleArray.splice(index, 1);
            });

            // --- 🦴 DYNAMIC OVERLAY DESIGN ENGINE STYLE TOGGLES ---
            if(CONFIG.trackerStyle !== 'none' && rawLandmarks) {
                canvasCtx.save();
                
                if(CONFIG.trackerStyle === 'skeleton') {
                    // Draw interconnected calming soft-blue bone tracking vectors
                    canvasCtx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                    canvasCtx.lineWidth = 5;
                    canvasCtx.lineCap = 'round';
                    
                    const connections = [
                        [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Upper torso body
                        [11, 23], [12, 24], [23, 24], [23, 25], [24, 26], [25, 27], [26, 28] // Lower base limbs
                    ];
                    
                    connections.forEach(([i1, i2]) => {
                        let p1 = rawLandmarks[i1], p2 = rawLandmarks[i2];
                        if(p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
                            let x1 = CONFIG.mirror ? (p1.x * w) : (w - (p1.x * w));
                            let x2 = CONFIG.mirror ? (p2.x * w) : (w - (p2.x * w));
                            canvasCtx.beginPath();
                            canvasCtx.moveTo(x1, p1.y * h);
                            canvasCtx.lineTo(x2, p2.y * h);
                            canvasCtx.stroke();
                        }
                    });
                }

                // Render Active Tracking Target Markers (Circles Mode)
                activeTrackers.forEach(t => {
                    let isSky = t.y < h * CONFIG.landLineY;
                    canvasCtx.save();
                    canvasCtx.shadowBlur = 12;
                    canvasCtx.shadowColor = isSky ? '#facc15' : '#38bdf8';
                    canvasCtx.fillStyle = '#ffffff'; // Professional crisp white core center
                    canvasCtx.beginPath();
                    canvasCtx.arc(t.x, t.y, 8, 0, Math.PI * 2);
                    canvasCtx.fill();
                    canvasCtx.restore();
                });

                canvasCtx.restore();
            }

            canvasCtx.restore();
        }

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function initEcosystemPools() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            
            fishArray = []; trashArray = []; padArray = [];
            for(let i=0; i<5; i++) fishArray.push(new Fish(i));
            for(let i=0; i<4; i++) trashArray.push(new Trash());
            for(let i=0; i<CONFIG.padCount; i++) padArray.push(new LilyPad(i, CONFIG.padCount));
        }

        // Initialize MediaPipe Lifecycle Hook configurations
        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onPoseEngineResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await pose.send({ image: videoElement }); },
            width: 640, height: 480
        });

        // Prompt client for internal media capture stream to map full-screen background canvas tracking
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            videoElement.srcObject = stream;
        });

        window.addEventListener('resize', () => { initEcosystemPools(); updateParameters(); });

        initEcosystemPools();
        camera.start();
    </script>
</body>
</html>
