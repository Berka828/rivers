<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeletal Pose Interactive Ecosystem</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #090d16;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }
        #app-container {
            position: relative;
            flex-grow: 1;
            height: 100vh;
            background: #0284c7;
        }
        video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* --- 🎛️ Control Panel Sidebar Design --- */
        #control-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 340px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            color: #f8fafc;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            overflow-y: auto;
        }
        #control-panel.open {
            transform: translateX(0);
        }
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            z-index: 60;
            transition: all 0.2s ease;
        }
        .toggle-btn:hover { background: #0284c7; }
        
        h3 { margin-bottom: 20px; color: #38bdf8; letter-spacing: 0.5px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .setting-group { margin-bottom: 22px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase;}
        .slider-container { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex-grow: 1; accent-color: #38bdf8; background: #334155; height: 6px; border-radius: 3px; appearance: none; }
        .val-display { font-family: monospace; font-size: 14px; color: #38bdf8; width: 45px; text-align: right; }
        
        /* Styled Checkbox Toggle */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-box { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
        .slider-box:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider-box { background-color: #0ea5e9; }
        input:checked + .slider-box:before { transform: translateX(22px); }

        #loading {
            position: absolute;
            inset: 0;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            z-index: 100;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .spinner { border: 3px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: #38bdf8; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Initializing Skeletal Tracking Engine... Stand in Frame</div>
    </div>

    <div id="app-container">
        <button class="toggle-btn" onclick="toggleSettings()">⚙️ Settings Control</button>
        
        <div id="control-panel" class="wrapper">
            <h3>Ecosystem Config</h3>
            
            <div class="setting-group">
                <label>Mirror Camera View</label>
                <label class="switch">
                    <input type="checkbox" id="param-mirror" checked onchange="updateParameters()">
                    <span class="slider-box"></span>
                </label>
            </div>

            <div class="setting-group">
                <label>Sky Boundary (Top %)</label>
                <div class="slider-container">
                    <input type="range" id="param-sky" min="0.1" max="0.45" step="0.01" value="0.33" oninput="updateParameters()">
                    <span class="val-display" id="val-sky">33%</span>
                </div>
            </div>

            <div class="setting-group">
                <label>River Level (Bottom %)</label>
                <div class="slider-container">
                    <input type="range" id="param-water" min="0.55" max="0.9" step="0.01" value="0.66" oninput="updateParameters()">
                    <span class="val-display" id="val-water">66%</span>
                </div>
            </div>

            <div class="setting-group">
                <label>Tracking Sensitivity</label>
                <div class="slider-container">
                    <input type="range" id="param-confidence" min="0.3" max="0.8" step="0.05" value="0.5" onchange="reinitMediaPipe()">
                    <span class="val-display" id="val-confidence">0.5</span>
                </div>
            </div>
            
            <div class="setting-group">
                <label>Interaction Radius</label>
                <div class="slider-container">
                    <input type="range" id="param-radius" min="60" max="250" step="10" value="140" oninput="updateParameters()">
                    <span class="val-display" id="val-radius">140px</span>
                </div>
            </div>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingScreen = document.getElementById('loading');
        
        let animationTime = 0;
        let activeTrackers = [];
        let fishArray = [];
        let padArray = [];

        // =================================================================
        // ⚙️ LIVE CUSTOMIZABLE ENGINE CONFIG
        // =================================================================
        let CONFIG = {
            mirror: true,
            skyLineY: 0.33,
            landLineY: 0.66,
            touchRadius: 140,
            confidence: 0.5,
            padCount: 4
        };

        function toggleSettings() {
            document.getElementById('control-panel').classList.toggle('open');
        }

        // Catch parameter changes from UI inputs instantly
        function updateParameters() {
            CONFIG.mirror = document.getElementById('param-mirror').checked;
            CONFIG.skyLineY = parseFloat(document.getElementById('param-sky').value);
            CONFIG.landLineY = parseFloat(document.getElementById('param-water').value);
            CONFIG.touchRadius = parseInt(document.getElementById('param-radius').value);

            document.getElementById('val-sky').innerText = Math.round(CONFIG.skyLineY * 100) + "%";
            document.getElementById('val-water').innerText = Math.round(CONFIG.landLineY * 100) + "%";
            document.getElementById('val-radius').innerText = CONFIG.touchRadius + "px";
            
            // Recalculate entity layers safely inside water bounds
            fishArray.forEach(f => f.resetY());
            padArray.forEach(p => p.y = window.innerHeight - 50);
        }

        // =================================================================
        // 🐠 GRAPHICS ENTITIES MODEL PIPELINE
        // =================================================================
        class LilyPad {
            constructor(index, total) {
                this.x = (window.innerWidth / (total + 1)) * (index + 1);
                this.y = window.innerHeight - 50; 
                this.radiusX = 65;
                this.radiusY = 22;
                const hues = [140, 290, 25, 200];
                this.color = `hsl(${hues[index % hues.length]}, 85%, 55%)`;
                this.glow = 0;
            }
            update(trackers) {
                this.glow = lerp(this.glow, 0, 0.07);
                trackers.forEach(t => {
                    if(Math.hypot(this.x - t.x, this.y - t.y) < CONFIG.touchRadius) {
                        this.glow = 1.0; // Touch feedback glow activation loop
                    }
                });
            }
            draw() {
                canvasCtx.save();
                canvasCtx.shadowBlur = this.glow * 35;
                canvasCtx.shadowColor = this.color;
                canvasCtx.fillStyle = this.color;
                canvasCtx.beginPath();
                canvasCtx.ellipse(this.x, this.y, this.radiusX * (1 + this.glow*0.2), this.radiusY * (1 - this.glow*0.3), 0, 0, Math.PI * 1.8);
                canvasCtx.lineTo(this.x, this.y);
                canvasCtx.fill();
                canvasCtx.restore();
            }
        }

        class Fish {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.resetY();
                this.size = 35 + Math.random() * 15;
                this.speedX = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random() * 1.5);
                this.color = `hsl(${190 + Math.random() * 30}, 90%, 60%)`;
                this.wiggle = Math.random() * 5;
            }
            resetY() {
                let topBound = window.innerHeight * CONFIG.landLineY;
                this.y = topBound + 30 + Math.random() * (window.innerHeight - topBound - 100);
            }
            update(trackers) {
                this.wiggle += 0.15;
                this.x += this.speedX;
                if (this.x < -100 || this.x > window.innerWidth + 100) this.speedX *= -1;

                // Simple collision handling check against hands or feet trackers
                trackers.forEach(t => {
                    if(Math.hypot(this.x - t.x, this.y - t.y) < CONFIG.touchRadius) {
                        this.speedX = Math.sign(this.x - t.x) * 4; // Move away rapidly
                    }
                });
            }
            draw() {
                canvasCtx.save();
                canvasCtx.translate(this.x, this.y);
                if (this.speedX < 0) canvasCtx.scale(-1, 1);
                canvasCtx.fillStyle = this.color;
                canvasCtx.beginPath();
                let tailWiggle = Math.sin(this.wiggle) * 6;
                canvasCtx.moveTo(this.size, 0);
                canvasCtx.quadraticCurveTo(0, -this.size/2, -this.size, tailWiggle);
                canvasCtx.lineTo(-this.size - 10, tailWiggle - 10);
                canvasCtx.lineTo(-this.size - 10, tailWiggle + 10);
                canvasCtx.quadraticCurveTo(0, this.size/2, this.size, 0);
                canvasCtx.fill();
                canvasCtx.restore();
            }
        }

        function initEnvironment() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            fishArray = []; padArray = [];
            for(let i=0; i<5; i++) fishArray.push(new Fish());
            for(let i=0; i<CONFIG.padCount; i++) padArray.push(new LilyPad(i, CONFIG.padCount));
        }

        // =================================================================
        // 🦾 POSE GRAPHICS PIPELINE & EXTRACTION TRACKER
        // =================================================================
        function processPose(results) {
            let w = canvasElement.width;
            let h = canvasElement.height;
            activeTrackers = [];

            canvasCtx.clearRect(0, 0, w, h);
            canvasCtx.save();
            
            // Custom Mirror matrix implementation matching config state preference
            if(CONFIG.mirror) {
                canvasCtx.translate(w, 0);
                canvasCtx.scale(-1, 1);
            }

            // --- 🎬 Draw 3-Tier Canvas Background Base ---
            let skyLimit = h * CONFIG.skyLineY;
            let landLimit = h * CONFIG.landLineY;

            // Sky
            canvasCtx.fillStyle = '#bae6fd'; canvasCtx.fillRect(0, 0, w, skyLimit);
            // Sun ☀️
            canvasCtx.fillStyle = '#fde047'; canvasCtx.beginPath(); canvasCtx.arc(w*0.5, h*0.12, 45, 0, Math.PI*2); canvasCtx.fill();
            // Land
            canvasCtx.fillStyle = '#22c55e'; canvasCtx.fillRect(0, skyLimit, w, landLimit - skyLimit);
            // Water
            canvasCtx.fillStyle = '#0284c7'; canvasCtx.fillRect(0, landLimit, w, h - landLimit);

            // Wave Crest Processing Animate loop
            animationTime += 0.04;
            canvasCtx.fillStyle = 'rgba(56, 189, 248, 0.3)';
            canvasCtx.beginPath(); canvasCtx.moveTo(0, landLimit);
            for(let x=0; x<=w; x+=30) canvasCtx.lineTo(x, landLimit + Math.sin(x*0.01 + animationTime)*6);
            canvasCtx.lineTo(w, h); canvasCtx.lineTo(0, h); canvasCtx.fill();

            // --- 🦴 Skeletal Extraction Landmark Tracker Loop ---
            if (results.poseLandmarks) {
                loadingScreen.style.opacity = 0;

                // Extract Key Landmarks: Wrists (15, 16), Index Fingers (19, 20), Ankles/Feet (27, 28, 31, 32)
                const targetIndices = [15, 16, 19, 20, 27, 28, 31, 32];
                
                targetIndices.forEach(idx => {
                    let pt = results.poseLandmarks[idx];
                    if(pt && pt.visibility > 0.5) {
                        // Compute coordinate location mapped against system transformations
                        let targetX = CONFIG.mirror ? (pt.x * w) : (w - (pt.x * w));
                        activeTrackers.push({ x: targetX, y: pt.y * h, type: idx });
                    }
                });
            }

            // Update & Render Game Elements
            padArray.forEach(pad => { pad.update(activeTrackers); pad.draw(); });
            fishArray.forEach(fish => { fish.update(activeTrackers); fish.draw(); });

            // --- 🔴 Draw Debug Vector Trackers on Screen for verification ---
            activeTrackers.forEach(t => {
                canvasCtx.save();
                // Determine point type label context string
                let isFoot = t.type >= 27;
                canvasCtx.fillStyle = isFoot ? '#ef4444' : '#fbbf24'; // Red for Feet, Gold for Hands/Fingers
                canvasCtx.beginPath();
                canvasCtx.arc(CONFIG.mirror ? t.x : w - t.x, t.y, 18, 0, Math.PI * 2);
                canvasCtx.fill();
                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.lineWidth = 3;
                canvasCtx.stroke();
                canvasCtx.restore();
            });

            canvasCtx.restore();
        }

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        // =================================================================
        // 🔄 INITIALIZATION & LIFECYCLE MANAGEMENT
        // =================================================================
        let poseInstance = null;
        let cameraInstance = null;

        function initMediaPipe() {
            CONFIG.confidence = parseFloat(document.getElementById('param-confidence').value);
            document.getElementById('val-confidence').innerText = CONFIG.confidence;

            poseInstance = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            poseInstance.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: CONFIG.confidence,
                minTrackingConfidence: CONFIG.confidence
            });

            poseInstance.onResults(processPose);

            if(!cameraInstance) {
                cameraInstance = new Camera(videoElement, {
                    onFrame: async () => {
                        if(poseInstance) await poseInstance.send({ image: videoElement });
                    },
                    width: 640, height: 480
                });
                cameraInstance.start();
            }
        }

        function reinitMediaPipe() {
            if(poseInstance) {
                poseInstance.close();
                initMediaPipe();
            }
        }

        window.addEventListener('resize', () => {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            initEnvironment();
        });

        // Fire lifecycle setup hooks
        initEnvironment();
        initMediaPipe();
    </script>
</body>
</html>
