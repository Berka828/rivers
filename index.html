<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customizable 3-Tier Interactive Ecosystem</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror canvas for intuitive coordination */
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            font-size: 18px;
            font-weight: bold;
            color: #0369a1;
            pointer-events: none;
            z-index: 10;
            display: flex;
            gap: 25px;
        }
        .score-tag { color: #16a34a; }
        #loading {
            position: absolute;
            inset: 0;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Tuning the Ecosystem... Get ready to play!</div>
    </div>

    <div id="app-container">
        <div id="ui-overlay">
            <span>🏞️ Eco Explorer</span>
            <span class="score-tag">🗑️ Trash Collected: <span id="score-val">0</span></span>
        </div>
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreVal = document.getElementById('score-val');
        const loadingScreen = document.getElementById('loading');

        let trashCleanedCount = 0;
        let animationTime = 0;

        // =================================================================
        // 🎛️ ADJUSTABLE ENGINE SETTINGS (CUSTOMIZE ANYTHING HERE!)
        // =================================================================
        const CONFIG = {
            // Zone Boundaries (Percentages from top of screen: 0.0 to 1.0)
            skyLineY: 0.33,       // Sky takes upper third
            landLineY: 0.66,      // Land takes middle third, Water takes bottom third
            
            // Interaction Radii (Hitboxes in Pixels - make bigger for younger kids)
            vacuumRadius: 160,    
            tickleRadius: 90,     
            padTouchRadius: 80,   

            // Gameplay Multipliers
            maxTrashItems: 4,     
            maxFishCount: 5,      
            padCount: 4,          // Number of colorful pads along the bottom
            splashSensitivity: 0.04
        };

        // Arrays to hold our entities
        let fishArray = [];
        let trashArray = [];
        let padArray = [];
        let particleArray = [];
        let previousHands = [];

        // =================================================================
        // 🎨 ENTITY ENGINE CLASSES
        // =================================================================
        
        class LilyPad {
            constructor(index, total) {
                // Space them out proportionally along the river bed
                this.x = (window.innerWidth / (total + 1)) * (index + 1);
                this.y = window.innerHeight - 60; 
                this.baseRadiusX = 55 + Math.random() * 15;
                this.baseRadiusY = 22;
                this.radiusX = this.baseRadiusX;
                this.radiusY = this.baseRadiusY;
                
                // Cycle through vibrant, kid-friendly colors
                const hues = [145, 280, 15, 330]; 
                this.color = `hsl(${hues[index % hues.length]}, 85%, 55%)`;
                this.glow = 0;
                this.squishFactor = 1.0;
            }
            update() {
                // Smoothly return back to resting scale after being squished
                this.squishFactor = lerp(this.squishFactor, 1.0, 0.1);
                this.radiusX = this.baseRadiusX * (2.0 - this.squishFactor);
                this.radiusY = this.baseRadiusY * this.squishFactor;
                this.glow = lerp(this.glow, 0, 0.08);
            }
            draw() {
                canvasCtx.save();
                canvasCtx.shadowBlur = this.glow * 30;
                canvasCtx.shadowColor = this.color;
                
                // Draw Stylized Pad with a classic pie-slice cutout
                canvasCtx.fillStyle = this.color;
                canvasCtx.beginPath();
                canvasCtx.ellipse(this.x, this.y, this.radiusX, this.radiusY, 0, 0, Math.PI * 1.75);
                canvasCtx.lineTo(this.x, this.y);
                canvasCtx.closePath();
                canvasCtx.fill();
                
                // Highlight rim
                canvasCtx.strokeStyle = '#ffffff';
                canvasCtx.lineWidth = 2 + (this.glow * 3);
                canvasCtx.stroke();
                canvasCtx.restore();
            }
            triggerTouch() {
                this.squishFactor = 0.4; // Compress downwards
                this.glow = 1.0;         // Flash neon brightly
            }
        }

        class Fish {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.resetY();
                this.size = 30 + Math.random() * 15;
                this.speedX = (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 2);
                this.color = `hsl(${195 + Math.random() * 25}, 90%, 60%)`;
                this.tickled = false;
                this.tickleTimer = 0;
                this.wigglePhase = Math.random() * 10;
            }
            resetY() {
                let waterTop = window.innerHeight * CONFIG.landLineY;
                this.y = waterTop + 40 + Math.random() * (window.innerHeight - waterTop - 120);
            }
            update() {
                this.wigglePhase += 0.18;
                if(this.tickled) {
                    this.tickleTimer += 0.1;
                    this.y += Math.sin(this.tickleTimer * 3) * 4;
                    if(this.tickleTimer > Math.PI * 2) { this.tickled = false; this.tickleTimer = 0; }
                } else {
                    this.x += this.speedX;
                }
                if (this.x < -100 || this.x > window.innerWidth + 100) this.speedX *= -1;
            }
            draw() {
                canvasCtx.save();
                canvasCtx.translate(this.x, this.y);
                if (this.speedX < 0) canvasCtx.scale(-1, 1);

                let grad = canvasCtx.createLinearGradient(-this.size, 0, this.size, 0);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(0.6, this.color);
                
                canvasCtx.fillStyle = grad;
                canvasCtx.beginPath();
                let tail = Math.sin(this.wigglePhase) * 6;
                canvasCtx.moveTo(this.size, 0);
                canvasCtx.quadraticCurveTo(0, -this.size/2, -this.size, tail);
                canvasCtx.lineTo(-this.size - 12, tail - 12);
                canvasCtx.lineTo(-this.size - 8, tail);
                canvasCtx.lineTo(-this.size - 12, tail + 12);
                canvasCtx.quadraticCurveTo(0, this.size/2, this.size, 0);
                canvasCtx.fill();

                // Simple cartoony eyes
                canvasCtx.fillStyle = '#ffffff';
                canvasCtx.beginPath(); canvasCtx.arc(this.size*0.4, -4, 5, 0, Math.PI*2); canvasCtx.fill();
                canvasCtx.fillStyle = '#1e293b';
                canvasCtx.beginPath(); canvasCtx.arc(this.size*0.45, -4, 2, 0, Math.PI*2); canvasCtx.fill();
                canvasCtx.restore();
            }
        }

        class Trash {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                let waterTop = window.innerHeight * CONFIG.landLineY;
                this.y = waterTop + 20 + Math.random() * (window.innerHeight - waterTop - 100);
                this.size = 22;
                this.speedX = 0.6 + Math.random() * 0.8;
                this.rotation = Math.random() * Math.PI;
                this.isVacuumed = false;
                this.type = Math.random() > 0.5 ? 'bottle' : 'can';
            }
            update() {
                if(!this.isVacuumed) {
                    this.x += this.speedX;
                    this.rotation += 0.01;
                    if (this.x > window.innerWidth + 50) this.x = -50;
                }
            }
            draw() {
                canvasCtx.save();
                canvasCtx.translate(this.x, this.y);
                canvasCtx.rotate(this.rotation);
                canvasCtx.fillStyle = this.type === 'bottle' ? 'rgba(241, 245, 249, 0.75)' : '#cbd5e1';
                canvasCtx.strokeStyle = '#94a3b8';
                canvasCtx.lineWidth = 2;
                canvasCtx.fillRect(-10, -20, 20, 40);
                canvasCtx.strokeRect(-10, -20, 20, 40);
                canvasCtx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, type = 'dot') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.size = type === 'ring' ? 10 : 3 + Math.random() * 6;
                this.vx = (Math.random() - 0.5) * 7;
                this.vy = (Math.random() - 0.5) * 7;
                this.alpha = 1;
            }
            update() {
                if(this.type === 'ring') {
                    this.size += 4; // Expand outward like a ripple
                    this.alpha -= 0.03;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= 0.02;
                }
            }
            draw() {
                canvasCtx.save();
                canvasCtx.globalAlpha = this.alpha;
                canvasCtx.strokeStyle = this.color;
                canvasCtx.fillStyle = this.color;
                canvasCtx.beginPath();
                if(this.type === 'ring') {
                    canvasCtx.lineWidth = 4;
                    canvasCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    canvasCtx.stroke();
                } else {
                    canvasCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    canvasCtx.fill();
                }
                canvasCtx.restore();
            }
        }

        // =================================================================
        // 🗺️ STRUCTURAL ENVIRONMENT ENGINE
        // =================================================================
        
        function initEnvironment() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            
            fishArray = []; trashArray = []; padArray = [];
            for(let i=0; i<CONFIG.maxFishCount; i++) fishArray.push(new Fish());
            for(let i=0; i<CONFIG.maxTrashItems; i++) trashArray.push(new Trash());
            for(let i=0; i<CONFIG.padCount; i++) padArray.push(new LilyPad(i, CONFIG.padCount));
        }

        function drawBackgroundTiers(activeHands) {
            let w = canvasElement.width;
            let h = canvasElement.height;
            
            let skyLimit = h * CONFIG.skyLineY;
            let landLimit = h * CONFIG.landLineY;

            // 🌤️ 1. Sky Layer (Top Third)
            let skyGrad = canvasCtx.createLinearGradient(0, 0, 0, skyLimit);
            skyGrad.addColorStop(0, '#bae6fd'); skyGrad.addColorStop(1, '#bae6fd');
            canvasCtx.fillStyle = skyGrad;
            canvasCtx.fillRect(0, 0, w, skyLimit);

            // ☀️ Interactive Sun Core
            let sunX = w * 0.5, sunY = h * 0.12, isNearSun = false;
            activeHands.forEach(hand => {
                if(Math.hypot((hand.x*w)-sunX, (hand.y*h)-sunY) < 160) isNearSun = true;
            });
            canvasCtx.fillStyle = isNearSun ? '#facc15' : '#fde047';
            canvasCtx.beginPath(); canvasCtx.arc(sunX, sunY, 45, 0, Math.PI*2); canvasCtx.fill();
            // Simple happy eyes/smile
            canvasCtx.fillStyle = '#475569';
            canvasCtx.beginPath(); canvasCtx.arc(sunX-12, sunY-6, 5, 0, Math.PI*2); canvasCtx.arc(sunX+12, sunY-6, 5, 0, Math.PI*2); canvasCtx.fill();
            canvasCtx.lineWidth = 4; canvasCtx.beginPath(); canvasCtx.arc(sunX, sunY+4, 12, 0, Math.PI); canvasCtx.stroke();

            // 🪵 2. Land Layer (Middle Third)
            let landGrad = canvasCtx.createLinearGradient(0, skyLimit, 0, landLimit);
            landGrad.addColorStop(0, '#4ade80'); // Bright Grass Green
            landGrad.addColorStop(1, '#16a34a');
            canvasCtx.fillStyle = landGrad;
            canvasCtx.fillRect(0, skyLimit, w, landLimit - skyLimit);

            // Soft riverbank muddy edge detailing
            canvasCtx.fillStyle = '#ca8a04'; 
            canvasCtx.fillRect(0, landLimit - 12, w, 12);

            // 🌊 3. River Water Layer (Bottom Third)
            let waterGrad = canvasCtx.createLinearGradient(0, landLimit, 0, h);
            waterGrad.addColorStop(0, '#0284c7'); // Deep River Blue
            waterGrad.addColorStop(1, '#075985');
            canvasCtx.fillStyle = waterGrad;
            canvasCtx.fillRect(0, landLimit, w, h - landLimit);

            // Dynamic Wave crests
            animationTime += 0.03;
            canvasCtx.fillStyle = 'rgba(56, 189, 248, 0.3)';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, landLimit);
            for(let x=0; x<=w; x+=25) {
                canvasCtx.lineTo(x, landLimit + Math.sin(x*0.01 + animationTime)*5);
            }
            canvasCtx.lineTo(w, h); canvasCtx.lineTo(0, h); canvasCtx.fill();
        }

        // =================================================================
        // 🦾 PIPELINE TRACKING PROCESSING LOOP
        // =================================================================
        
        function processInteractions(results) {
            let w = canvasElement.width;
            let h = canvasElement.height;
            let currentHands = [];

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                loadingScreen.style.opacity = 0;
                setTimeout(() => loadingScreen.style.display = 'none', 500);

                for (const landmarks of results.multiHandLandmarks) {
                    let px = landmarks[0].x * w;
                    let py = landmarks[0].y * h;
                    currentHands.push({x: landmarks[0].x, y: landmarks[0].y});

                    // Water Zone interactions mapped exclusively below land boundary line
                    if (landmarks[0].y > CONFIG.landLineY) {
                        
                        // Splash trigger check
                        let prev = previousHands.find(h => Math.abs(h.x - landmarks[0].x) < 0.2);
                        if(prev) {
                            let speed = Math.hypot(landmarks[0].x - prev.x, landmarks[0].y - prev.y);
                            if(speed > CONFIG.splashSensitivity) {
                                for(let i=0; i<4; i++) particleArray.push(new Particle(px, py, '#38bdf8'));
                            }
                        }

                        // Lily Pad Touch Collision Checker
                        padArray.forEach(pad => {
                            if(Math.hypot(pad.x - px, pad.y - py) < CONFIG.padTouchRadius && pad.glow < 0.2) {
                                pad.triggerTouch();
                                // Emit beautiful, expandable mathematical musical rings
                                for(let r=0; r<2; r++) particleArray.push(new Particle(pad.x, pad.y, pad.color, 'ring'));
                            }
                        });

                        // Trash Processing Vacuum
                        trashArray.forEach((trash, idx) => {
                            let dist = Math.hypot(trash.x - px, trash.y - py);
                            if (dist < CONFIG.vacuumRadius) {
                                trash.isVacuumed = true;
                                trash.x = lerp(trash.x, px, 0.25);
                                trash.y = lerp(trash.y, py, 0.25);

                                if(dist < 32) {
                                    for(let p=0; p<12; p++) particleArray.push(new Particle(trash.x, trash.y, '#22c55e'));
                                    trashCleanedCount++;
                                    scoreVal.innerText = trashCleanedCount;
                                    trashArray[idx] = new Trash();
                                }
                            }
                        });

                        // Fish Tickler
                        fishArray.forEach(fish => {
                            if(Math.hypot(fish.x - px, fish.y - py) < CONFIG.tickleRadius && !fish.tickled) {
                                fish.tickled = true;
                                fish.speedX *= -1.3;
                                for(let b=0; b<4; b++) particleArray.push(new Particle(fish.x, fish.y, '#e2e8f0'));
                            }
                        });
                    }
                }
            }

            previousHands = currentHands;

            // Draw Background and Layers
            drawBackgroundTiers(currentHands);

            // Update & Render Loops
            padArray.forEach(pad => { pad.update(); pad.draw(); });
            fishArray.forEach(fish => { fish.update(); fish.draw(); });
            trashArray.forEach(trash => { trash.update(); trash.draw(); });
            
            particleArray.forEach((part, idx) => {
                part.update(); part.draw();
                if(part.alpha <= 0) particleArray.splice(idx, 1);
            });

            // Render Stylized Interactive Hand Overlays
            currentHands.forEach(hand => {
                canvasCtx.fillStyle = hand.y > CONFIG.landLineY ? 'rgba(56, 189, 248, 0.7)' : 'rgba(253, 224, 71, 0.8)';
                canvasCtx.beginPath(); canvasCtx.arc(hand.x * w, hand.y * h, 20, 0, Math.PI * 2); canvasCtx.fill();
                canvasCtx.strokeStyle = '#ffffff'; canvasCtx.lineWidth = 3; canvasCtx.stroke();
            });
        }

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        // =================================================================
        // ⚡ MEDIAPIPE INITIALIZATION ENGINE
        // =================================================================
        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 4, modelComplexity: 1, minDetectionConfidence: 0.45, minTrackingConfidence: 0.45 });
        hands.onResults(processInteractions);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({ image: videoElement }); },
            width: 640, height: 480
        });

        window.addEventListener('resize', () => {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            padArray.forEach((pad, idx) => {
                pad.x = (window.innerWidth / (CONFIG.padCount + 1)) * (idx + 1);
                pad.y = window.innerHeight - 60;
            });
            fishArray.forEach(f => f.resetY());
        });

        initEnvironment();
        camera.start().catch(err => alert("Webcam setup blocked. Please grant camera access permissions."));
    </script>
</body>
</html>
